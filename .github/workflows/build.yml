name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build with Gradle
        run: make build
      
      - name: Run tests
        run: make test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
      
      - name: Run SpotBugs
        run: make spotbugs
        continue-on-error: true
      
      - name: Upload SpotBugs results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-results
          path: |
            app/build/reports/spotbugs/
      
      - name: Run OWASP Dependency Check
        run: make dependency-check
        continue-on-error: true
      
      - name: Upload Dependency Check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-results
          path: |
            app/build/reports/dependency-check-report.html
            app/build/reports/dependency-check-report.xml
      
      - name: Build Docker image
        run: make image
      
      - name: Scan image
        uses: anchore/scan-action@v6
        with:
          image: "spring-starter-java:latest"
          fail-build: false
          severity-cutoff: high
          output-format: table
          output-file: "scan-report.txt"

      - name: Show Reports
        run: |
          cat scan-report.txt
        shell: bash




