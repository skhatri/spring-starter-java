management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,otlp
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

spring:
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true

core:
  environment: prod
  db: pg
  pg:
    host: "${PG_HOST:postgres}"
    port: ${PG_PORT:5432}
    username: "${PG_USER:postgres}"
    password: "${PG_PASSWORD:password}"
    database: "${PG_DB:starter}"

logging:
  level:
    root: WARN
    com.github.starter: INFO 