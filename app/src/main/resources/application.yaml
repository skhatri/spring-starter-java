endpoints:
  enabled: true
  trace:
    enabled: false
  health:
    enabled: true
  info:
    enabled: true
  metrics:
    enabled: true

  cors.allowed-origins: http://localhost
  cors.allowed-methods: GET,POST

server:
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

spring:
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  application:
    name: spring-starter-java
  profiles:
    active: dev
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,otlp
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms
  tracing:
    sampling:
      probability: 1.0

otel:
  sdk:
    disabled: false
  exporter:
    otlp:
      enabled: true
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: ${spring.application.name}


core:
  db: pg
  environment: default
  version: 1.0.0
  pg:
    host: "${PG_HOST:postgres}"
    port: ${PG_PORT:5432}
    username: "${PG_USER:postgres}"
    password: "${PG_PASSWORD:password}"
    database: "${PG_DB:starter}"

logging:
  level:
    root: INFO
    com.github.starter: DEBUG