endpoints:
  enabled: true
  trace:
    enabled: false
  health:
    enabled: true
  info:
    enabled: true
  metrics:
    enabled: true

  cors.allowed-origins: http://localhost
  cors.allowed-methods: GET,POST

server.error.whitelabel.enabled: false

spring:
  application:
    name: spring-starter-java
  profiles:
    active: dev
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms
  tracing:
    sampling:
      probability: 1.0

# OpenTelemetry Configuration
otel:
  sdk:
    disabled: false
  exporter:
    otlp:
      enabled: true
      endpoint: http://localhost:4317
  metrics:
    exporter: prometheus
  logs:
    exporter: otlp
  resource:
    attributes:
      service.name: ${spring.application.name}

core:
  db: pg
  environment: default
  version: 1.0.0
  pg:
    host: localhost
    port: 5432
    username: postgres
    password: password
    database: starter 

logging:
  level:
    root: INFO
    com.github.starter: DEBUG